<li class="card">
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <span class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.categories }}<span class="tag">{{ index . 0 }}</span>{{ end }}
  </span>
  {{ with .Summary }}<p>{{ . | plainify | truncate 110 }}</p>{{ end }}
  <a class="more" href="{{ .RelPermalink }}">阅读全文<span class="sr-only">：{{ .Title }}</span><span aria-hidden="true"> →</span></a>
</li>
