baseURL = "https://hellogcc.org/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "OSDT / HelloGCC"
theme = "osdt-tech"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 40

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "开源开发工具技术社区博客，聚焦 GCC、LLVM、QEMU、RISC-V 与 OSDT 社区活动。"
  heroTitle = "开源开发工具社区博客"
  tagline = "GCC · LLVM · QEMU · RISC-V · OSDT Conf"
  heroSubtitle = "HelloGCC / OSDT 社区自 2007 年起的技术文章、社区动态与开源开发工具大会（OSDT Conf）征稿信息。"
  repoURL = "https://github.com/hellogcc/hellogcc.github.io"
  readmeHistoryCategory = "README历史"
  eventCategory = "社区活动"

